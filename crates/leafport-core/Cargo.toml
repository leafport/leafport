[package]
name = "leafport-core"
version.workspace = true
edition.workspace = true

[dependencies]
reqwest.workspace = true
roxmltree.workspace = true

aes = "0.9.3"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc"] }
flate2 = "1.1.10"
humantime = "2.4.0"
image = {
    version = "0.25.10",
    default-features = false,
    features = ["png", "jpeg"],
}
keyring = "4.2.0"
lopdf = "0.46.0"
md-5 = "0.11.0"
p12 = "0.6.3"
pdfium-render = { version = "0.9.4", features = ["thread_safe"] }
percent-encoding = "2.3.2"
rand = "0.10.3"
rc4 = "0.2.0"
rsa = "0.9.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
sha1 = "0.11.0"
x509-cert = "0.3.0"
# p12 exposes yasna 0.5 reader types in its parsing API.
yasna = "0.5.2"
zeroize = "1.9.1"
zip = {
    version = "9.0.5",
    default-features = false,
    features = ["deflate"],
}
