name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The Release workflow runs these checks before it builds anything.
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when called, so a release's checks never cancel, or get
# cancelled by, a regular CI run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
          cache: false
      - run: cargo fmt --all --check

  # Each platform compiles its own front end: GTK on Linux, egui on macOS and Windows.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy

      - uses: ./.github/actions/install-dependencies

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
