[package]
name = "leafport-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
leafport-core = { path = "../leafport-core" }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
rfd = "0.17.2"
roxmltree.workspace = true
zip = { version = "4.6", default-features = false, features = ["deflate"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
pdf-extract = "0.12.1"
machine-uid = "0.6.0"
pdfium-render = { version = "0.9.4", features = ["thread_safe"] }
sha1 = "0.10.6"
base64 = "0.22.1"
