[package]
name = "leafport-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Keep your ebooks in sync"

[dependencies]
leafport-app = { path = "../leafport-app" }
leafport-core = { path = "../leafport-core" }

image = {
    version = "0.25.10",
    default-features = false,
    features = ["png", "jpeg"],
}

# Linux and the other Unix desktops: GTK and libadwaita.
[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
async-channel = "2.5.0"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"] }

# macOS and Windows: egui.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
eframe = {
    version = "0.37.0",
    default-features = false,
    features = [
        "clipboard",
        "default_fonts",
        "glow",
    ],
}
rfd = "0.17.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
