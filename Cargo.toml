[workspace]
resolver = "3"
members = [
    "crates/leafport-app",
    "crates/leafport-core",
    "crates/leafport-cli",
    "crates/leafport-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/leafport/leafport"

[workspace.dependencies]
reqwest = {
    version = "0.13.5",
    default-features = false,
    features = [
        "blocking",
        "rustls",
        "charset",
        "system-proxy",
    ],
}
roxmltree = "0.21.2"
