[package]
name = "leafport-desktop"
version.workspace = true
edition.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
leafport-app = { path = "../leafport-app" }
leafport-core = { path = "../leafport-core" }

eframe = {
    version = "0.37.0",
    default-features = false,
    features = [
        "clipboard",
        "default_fonts",
        "glow",
    ],
}
image = {
    version = "0.25.10",
    default-features = false,
    features = ["png", "jpeg"],
}
rfd = "0.17.2"
