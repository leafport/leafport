[package]
name = "leafport-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
leafport-app = { path = "../leafport-app" }
leafport-core = { path = "../leafport-core" }

eframe = {
    version = "0.37.0",
    default-features = false,
    features = [
        "clipboard",
        "default_fonts",
        "glow",
        "wayland",
        "x11",
    ],
}
image = {
    version = "0.25.10",
    default-features = false,
    features = ["png", "jpeg"],
}
rfd = "0.17.2"
# Direct dependency only to enable Adwaita client-side decorations in eframe's winit on GNOME Wayland.
winit = {
    version = "0.30.13",
    default-features = false,
    features = ["wayland", "wayland-csd-adwaita"],
}
