[package]
name = "leafport-gtk"
version.workspace = true
edition.workspace = true

[dependencies]
leafport-app = { path = "../leafport-app" }
leafport-core = { path = "../leafport-core" }

adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
async-channel = "2.5.0"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"] }
image = {
    version = "0.25.10",
    default-features = false,
    features = ["png", "jpeg"],
}
