name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The Release workflow runs these checks before it builds anything.
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when called, so a release's checks never cancel, or get
# cancelled by, a regular CI run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
          cache: false
      - run: cargo fmt --all --check

  # Each platform compiles its own front end: GTK on Linux, egui on macOS and Windows. The tests
  # run once per OS; nothing in the code depends on the CPU architecture, so the ARM runners only
  # build and link them, which catches the C dependencies failing there.
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            run-tests: true
          - os: ubuntu-24.04-arm
            run-tests: false
          - os: macos-26
            run-tests: true
          - os: windows-2025
            run-tests: true
          - os: windows-11-arm
            run-tests: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-dependencies
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        if: matrix.run-tests
        run: cargo test --workspace --locked

      - name: Build the tests
        if: ${{ !matrix.run-tests }}
        run: cargo test --workspace --locked --no-run
